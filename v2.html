  if(this.seg)for(const sg of this.seg)for(const m of sg)m.visible=false},
 step(dt,I){const s=this.s,nc=[],cr=[0,0];
  for(let i=0;i<2;i++){const c=s.c[i],u=I[i];if(u.tl!=u.tr){const dx=c[2],dz=c[3];if(u.tr){c[2]=-dz;c[3]=dx}else{c[2]=dz;c[3]=-dx}if(dx)c[0]=Math.floor(c[0])+.5;else c[1]=Math.floor(c[1])+.5;s.p[i].push([rd(c[0]),rd(c[1])]);tone(700,.04,'square',.03)}
   c[0]+=c[2]*13*dt;c[1]+=c[3]*13*dt;nc[i]=this.cell(c[0],c[1])}
  for(let i=0;i<2;i++){const n=nc[i],o=this.pc[i];if(n[0]!=o[0]||n[1]!=o[1]){if(!this.free(n[0],n[1])||(nc[1-i][0]==n[0]&&nc[1-i][1]==n[1]&&(nc[1-i][0]!=this.pc[1-i][0]||nc[1-i][1]!=this.pc[1-i][1])))cr[i]=1;else{this.occ[n[1]*40+n[0]]=i+1;this.pc[i]=n}}}
  for(let i=0;i<2;i++)if(cr[i]){burst(cl(s.c[i][0],-20,20),.8,cl(s.c[i][1],-20,20),this.col[i],50,12,1,.3,4);tone(100,.7,'sawtooth',.12)}
  return cr[0]&&cr[1]?3:cr[0]?2:cr[1]?1:0},
 get(){const s=this.s;return{c:s.c.map(r2),p:s.p}},set(o){this.T=o},
 draw(dt,me){const hs=host(),q=hs?this.s:this.T,k=hs?1:Math.min(1,dt*14);if(!this.d.c)this.d.c=JSON.parse(JSON.stringify(q.c));
  for(let i=0;i<2;i++){const d=this.d.c[i],t=q.c[i];for(let j=0;j<2;j++)d[j]+=(t[j]-d[j])*k;d[2]=t[2];d[3]=t[3];this.h[i].position.set(d[0],0,d[1]);this.h[i].rotation.y=Math.atan2(-d[2],-d[3]);
   const pts=q.p[i].concat([[d[0],d[1]]]),sg=this.seg[i];while(sg.length<pts.length-1){const m=new THREE.Group();bx(m,1,.8,1,MB(this.col[i]),0,0,0);bx(m,1.9,1.5,1.9,MB(this.col[i],{transparent:true,opacity:.22}),0,0,0);this.g.add(m);sg.push(m)}
   for(let j=0;j<sg.length;j++){const a=pts[j],b=pts[j+1],m=sg[j];if(!b){m.visible=false;continue}m.visible=true;const w=Math.abs(b[0]-a[0]),h=Math.abs(b[1]-a[1]);m.position.set((a[0]+b[0])/2,.45,(a[1]+b[1])/2);m.scale.set(w>h?w+.4:.3,1,w>h?.3:h+.4)}}
  const c=this.d.c[me],tx=c[0]-c[2]*9,tz=c[1]-c[3]*9,kk=this.snap?1:1-Math.exp(-5*dt);this.snap=0;CAM.position.x+=(tx-CAM.position.x)*kk;CAM.position.y+=(6.5-CAM.position.y)*kk;CAM.position.z+=(tz-CAM.position.z)*kk;CAM.lookAt(c[0]+c[2]*7,.5,c[1]+c[3]*7);setFov(innerWidth<innerHeight?85:68)},
 bot(){const s=this.s,c=s.c[1],[a,b]=this.cell(c[0],c[1]),dx=Math.sign(c[2]),dz=Math.sign(c[3]),run=(x,z,ex,ez)=>{let n=0;for(let i=1;i<=6;i++){if(!this.free(x+ex*i,z+ez*i))break;n++}return n};
  const ahead=run(a,b,dx,dz);if(ahead>=4&&Math.random()>.02)return{tl:0,tr:0};const L=run(a,b,dz,-dx),Rr=run(a,b,-dz,dx);return L>Rr?{tl:1,tr:0}:{tl:0,tr:1}}};
const GAMES={shooter:SH,space:SP,puck:PONG,sumo:SUMO,tron:TRON};

// ================= Ablauf =================
function endGame(){if(cur){if(cur.cleanup)cur.cleanup();if(cur.g)S.remove(cur.g)}cur=null;fxClear();S.fog=null;LIGHT.castShadow=false;$('hud').style.display='none';$('big').textContent='';$('hint').textContent='';$('hx').innerHTML='';lastH='';$('xh').style.display='none';$('mk').style.display='none';$('mb').style.display='none';for(const id of['bF','bB','bC'])$(id).style.display='none';$('js').style.display='none';jx=jy=0}
function startGame(n,seed){endGame();cur=GAMES[n];curK=n;me=net==2?1:0;sc=[0,0];ph='cd';tm=3;lastW=0;Object.assign(I0,{x:0,y:0,yaw:0,pitch:0,f:0,b:0,c:0,tl:0,tr:0});Object.assign(In1,{x:0,y:0,yaw:0,pitch:0,f:0,b:0,c:0,tl:0,tr:0});EV.length=0;
 CAM.position.set(0,10,20);CAM.rotation.set(0,0,0);CAM.up.set(0,1,0);cur.init(seed||1);$('menu').style.display='none';$('menu').className='';$('hud').style.display='block';$('hint').textContent=cur.hint;$('xh').style.display=cur.xh?'block':'none';$('mb').style.display=net==2?'none':'flex';
 const B=cur.btns||{};[['f','bF'],['b','bB'],['c','bC']].forEach(([k,id])=>{$(id).style.display=B[k]?'flex':'none';$(id).textContent=B[k]||''})}
function toMenu(){endGame();scr=net==2?'guestwait':'pick';ui()}
function begin(n){const seed=Math.random()*1e9|0;if(net==1&&conn&&conn.open)conn.send({t:'go',g:n,seed});startGame(n,seed)}
function hostStep(dt){
 if(ph=='cd'){tm-=dt;if(tm<=0)ph='play'}
 else if(ph=='play'){const I1=solo?Object.assign({x:0,y:0,yaw:0,pitch:0,f:0,b:0,c:0,tl:0,tr:0},cur.bot(dt)):In1;const r=cur.step(dt,[I0,I1]);if(r&&ph=='play')point(r)}
 else if(ph=='pt'){tm-=dt;if(tm<=0){cur.reset(lastW);ph='cd';tm=2}}
 I0.c=I0.tl=I0.tr=0;In1.c=In1.tl=In1.tr=0;
 if(net==1&&conn&&conn.open){sT-=dt;if(sT<=0){sT=.05;conn.send({t:'s',s:cur.get(),sc,ph,tm:+tm.toFixed(2),w:lastW,ev:EV.splice(0)})}}else EV.length=0}
function guestStep(dt){tm-=dt;iT-=dt;if(iT<=0&&conn&&conn.open){iT=.033;conn.send({t:'in',v:[rd(I0.x),rd(I0.y),rd(I0.yaw),rd(I0.pitch),I0.f,I0.b,I0.c,I0.tl,I0.tr]});I0.c=I0.tl=I0.tr=0}}
function hudUpdate(){$('hud').textContent=`Du ${sc[me]} : ${sc[1-me]} Gegner`;let t='';
 if(ph=='cd')t=tm>1.2?Math.ceil(tm-1):'Los!';else if(ph=='pt')t=lastW==3?'Unentschieden':lastW==me+1?'Punkt für dich! 🎉':'Punkt für den Gegner';else if(ph=='over')t=sc[me]>sc[1-me]?'🏆 Gewonnen!':'Verloren';else if(ph=='play'&&cur.msg)t=cur.msg(me);
 $('big').textContent=t;const h=cur.hud?cur.hud(me):'';if(h!==lastH){$('hx').innerHTML=h;lastH=h}}
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-lt)/1000||0);lt=t;
 if(cur){const hk=a=>a&&a.some(c=>K[c]),kx=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),ky=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0);I0.x=kx||jx;I0.y=ky||jy;I0.f=(hk(cur.kf)||mF||bF)?1:0;I0.b=(hk(cur.kb)||bB)?1:0;
  if(host())hostStep(dt);else guestStep(dt);cur.draw(dt,me);hudUpdate()}
 fxUpd(dt);dmgA=Math.max(0,dmgA-dt*2.2);hmA=Math.max(0,hmA-dt*4);$('dmg').style.opacity=dmgA;$('hm').style.opacity=hmA;R.render(S,CAM)}

// ================= Eingabe =================
const K={};let jx=0,jy=0,jp=null,lp=null,mP=null,mF=0,bF=0,bB=0,ox=0,oy=0,lx=0,ly=0;
addEventListener('keydown',e=>{K[e.code]=1;if(!cur)return;if(!e.repeat){if(cur.kc&&cur.kc.includes(e.code))I0.c=1;if(cur.tap){if(e.code=='KeyA'||e.code=='ArrowLeft')I0.tl=1;if(e.code=='KeyD'||e.code=='ArrowRight')I0.tr=1}}if(e.code=='Space'||e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
document.addEventListener('mousemove',e=>{if(document.pointerLockElement&&cur&&cur.look){I0.yaw-=e.movementX*.0025;I0.pitch=cl(I0.pitch-e.movementY*.0025,-1.45,1.45)}});
{const c=$('c'),JS=$('js'),JK=$('jk');
 c.onpointerdown=e=>{audioInit();if(!cur)return;const left=e.clientX<innerWidth*.5;
  if(e.pointerType=='mouse'&&cur.look){if(document.pointerLockElement!==c){if(c.requestPointerLock)c.requestPointerLock();return}mF=1;mP=e.pointerId;try{c.setPointerCapture(e.pointerId)}catch(x){}return}
  if(cur.tap){if(left)I0.tl=1;else I0.tr=1;return}
  if(left&&jp==null){jp=e.pointerId;ox=e.clientX;oy=e.clientY;JS.style.display='block';JS.style.left=ox+'px';JS.style.top=oy+'px';JK.style.transform='none'}
  else if(!left&&cur.look&&lp==null){lp=e.pointerId;lx=e.clientX;ly=e.clientY}
  try{c.setPointerCapture(e.pointerId)}catch(x){}};
 c.onpointermove=e=>{if(e.pointerId==jp){const dx=e.clientX-ox,dy=e.clientY-oy,l=Math.hypot(dx,dy),m=Math.min(1,l/50);jx=l?dx/l*m:0;jy=l?dy/l*m:0;JK.style.transform=`translate(${jx*40}px,${jy*40}px)`}
  else if(e.pointerId==lp){I0.yaw-=(e.clientX-lx)*.006;I0.pitch=cl(I0.pitch-(e.clientY-ly)*.006,-1.45,1.45);lx=e.clientX;ly=e.clientY}};
 c.onpointerup=c.onpointercancel=e=>{if(e.pointerId==jp){jp=null;jx=jy=0;JS.style.display='none'}if(e.pointerId==lp)lp=null;if(e.pointerId==mP){mP=null;mF=0}}}
for(const[id,k]of[['bF','f'],['bB','b'],['bC','c']]){const el=$(id);el.onpointerdown=e=>{e.preventDefault();audioInit();try{el.setPointerCapture(e.pointerId)}catch(x){}if(k=='f')bF=1;else if(k=='b')bB=1;else I0.c=1;el.classList.add('on')};el.onpointerup=el.onpointercancel=()=>{if(k=='f')bF=0;else if(k=='b')bB=0;el.classList.remove('on')}}
$('mb').onclick=()=>{if(net==1&&conn&&conn.open)conn.send({t:'menu'});toMenu()};

// ================= Online (WebRTC + ntfy zum Finden) =================
const NT='https://ntfy.sh/arenaduell-hub-';
async function nPost(t,m){const x=await fetch(NT+t,{method:'POST',body:m});if(!x.ok)throw new Error('Server '+x.status)}
async function nGet(t,since){const x=await fetch(NT+t+'/json?poll=1&since='+since);if(!x.ok)throw new Error('Server '+x.status);return(await x.text()).split('\n').filter(Boolean).map(l=>JSON.parse(l)).filter(q=>q.event=='message').map(q=>q.message)}
async function lobby(){try{lob=[...new Set(await nGet('lobby','5m'))].filter(c=>/^[A-Z0-9]{4}$/.test(c)).slice(-6)}catch(e){lob=[]}if(scr=='home')ui()}
function stopRoom(){if(es)es.close();es=null;clearInterval(lobHT);room=''}
function listen(code){es=new EventSource(NT+code+'/sse');es.onmessage=async e=>{try{const m=JSON.parse(e.data).message;if(m&&m.startsWith('a|')&&pc&&net==1&&!(conn&&conn.open)){await pc.setRemoteDescription(dec(m));msgT='Verbinde…';ui()}}catch(er){}}}
function enc(d){const g=re=>(re.exec(d.sdp)||[])[1],fp=g(/a=fingerprint:sha-256 (\S+)/).split(':').map(h=>String.fromCharCode(parseInt(h,16))).join(''),
 c=d.sdp.split(/\r?\n/).filter(l=>l.startsWith('a=candidate:')).map(l=>l.split(' ')).filter(a=>a[2].toLowerCase()=='udp'&&a[4].indexOf(':')<0&&(a[7]=='host'||a[7]=='srflx')).map(a=>a[4]+':'+a[5]+a[7][0]);
 return [d.type=='offer'?'o':'a',g(/a=ice-ufrag:(\S+)/),g(/a=ice-pwd:(\S+)/),btoa(fp),c.join(',')].join('|')}
function dec(t){const [Ro,u,p,f,c]=t.trim().split('|'),fp=Array.from(atob(f),ch=>ch.charCodeAt(0).toString(16).toUpperCase().padStart(2,'0')).join(':');
 return{type:Ro=='o'?'offer':'answer',sdp:`v=0\r\no=- ${Date.now()} 2 IN IP4 127.0.0.1\r\ns=-\r\nt=0 0\r\na=group:BUNDLE 0\r\nm=application 9 UDP/DTLS/SCTP webrtc-datachannel\r\nc=IN IP4 0.0.0.0\r\na=ice-ufrag:${u}\r\na=ice-pwd:${p}\r\na=fingerprint:sha-256 ${fp}\r\na=setup:${Ro=='o'?'actpass':'active'}\r\na=mid:0\r\na=sctp-port:5000\r\na=max-message-size:262144\r\n`+c.split(',').map((x,i)=>{const h=x.slice(-1)=='h',[ip,pt]=x.slice(0,-1).split(':');return `a=candidate:${i+1} 1 udp ${(h?2122260223:1686052607)-i} ${ip} ${pt} typ ${h?'host':'srflx'}${h?'':' raddr 0.0.0.0 rport 0'}\r\n`}).join('')}}
function gather(p){return new Promise(r=>{if(p.iceGatheringState=='complete')return r();p.onicegatheringstatechange=()=>{if(p.iceGatheringState=='complete')r()};setTimeout(r,5000)})}
function mkPC(){const p=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});p.onconnectionstatechange=()=>{if(p===pc&&p.connectionState=='failed')netOff('Verbindung fehlgeschlagen (Netzwerk/Firewall?)')};return p}
function setupDC(d){const cn={open:false,send:m=>{if(d.readyState=='open')d.send(JSON.stringify(m))},close:()=>{try{d.close()}catch(e){}}};
 d.onopen=()=>{stopRoom();cn.open=true;if(net==0)net=2;scr=net==2?'guestwait':'pick';ui()};
 d.onmessage=e=>{try{onData(JSON.parse(e.data))}catch(er){console.error(er)}};d.onclose=()=>{if(conn===cn)netOff('Verbindung getrennt')};conn=cn}
function onData(m){
 if(net==1){if(m.t=='in'){const v=m.v;In1.x=v[0];In1.y=v[1];In1.yaw=v[2];In1.pitch=v[3];In1.f=v[4];In1.b=v[5];In1.c|=v[6];In1.tl|=v[7];In1.tr|=v[8]}}
 else if(net==2){if(m.t=='go')startGame(m.g,m.seed);else if(m.t=='menu')toMenu();else if(m.t=='s'&&cur){cur.set(m.s);sc=m.sc;lastW=m.w;const o=ph;ph=m.ph;tm=m.tm;(m.ev||[]).forEach(fxEv);if(ph=='over'&&o!='over')ui('over')}}}
function netOff(msg){stopRoom();const c=conn;conn=null;try{c&&c.close();pc&&pc.close()}catch(e){}net=0;pc=null;solo=false;msgT=msg||'';endGame();scr='home';ui();lobT=0;lobby()}
async function hostGo(){try{net=1;scr='hostwait';msgT='Erzeuge Code…';ui();pc=mkPC();setupDC(pc.createDataChannel('g'));await pc.setLocalDescription(await pc.createOffer());await gather(pc);
  const rc=Math.random().toString(36).slice(2,6).toUpperCase();await nPost(rc,enc(pc.localDescription));room=rc;msgT='';listen(rc);nPost('lobby',rc).catch(()=>{});lobHT=setInterval(()=>nPost('lobby',rc).catch(()=>{}),60000);ui()}catch(e){netOff('Fehler: '+(e.message||e))}}
async function joinGo(t){try{t=(t||'').trim().toUpperCase();if(t.length!=4)throw new Error('Bitte den 4-stelligen Code eingeben');scr='joinwait';msgT='Suche Spiel…';ui();
  const ms=(await nGet(t,'all')).filter(q=>q.startsWith('o|'));if(!ms.length)throw new Error('Kein Spiel mit diesem Code gefunden');
  pc=mkPC();pc.ondatachannel=ev=>setupDC(ev.channel);await pc.setRemoteDescription(dec(ms[ms.length-1]));await pc.setLocalDescription(await pc.createAnswer());await gather(pc);await nPost(t,enc(pc.localDescription));msgT='Verbinde…';ui()}catch(e){netOff('Fehler: '+(e.message||e))}}

// ================= Menü =================
function ui(over){const m=$('menu'),b=(a,t,c)=>`<span class="b ${c||''}" data-a="${a}">${t}</span>`,old=($('jc')||{}).value||'',msg=`<div class="sub">${msgT}</div>`;
 const cards=`<div class="grid">`+Object.keys(GAMES).map(k=>`<div class="card ${net==2?'off':''}" data-a="g:${k}"><span class="ic">${GAMES[k].ic}</span><b>${GAMES[k].t}</b><span class="tag">${GAMES[k].tag}</span><div class="sub">${GAMES[k].d}</div></div>`).join('')+`</div>`;
 let h;m.style.display='flex';m.className=over?'over':'';
 if(over){const w=sc[me]>sc[1-me]?'🏆 Du hast gewonnen!':'Du hast verloren';scr='over';h=`<h1>${w}</h1><div class="sub">${sc[me]} : ${sc[1-me]}</div>`+(net==2?`<div class="sub">Der Host wählt das nächste Spiel…</div>`:b('again','Nochmal')+b('menu','Spielwahl','g'))}
 else if(scr=='pick')h=`<h1>Wähle ein Spiel</h1><div class="sub">${solo?'🤖 Gegen den Computer':'✓ Mitspieler verbunden'}</div>${cards}`+b('off','Zurück / Trennen','g');
 else if(scr=='guestwait')h=`<h1>Verbunden ✓</h1><div class="sub">Der Host wählt gleich ein Spiel…</div>${cards}`+b('off','Trennen','g');
 else if(scr=='hostwait')h=`<h1>Dein Code</h1><div class="code">${room||'…'}</div><div class="sub">Dein Mitspieler tippt den Code ein oder wählt dich unter „Offene Spiele“.</div>${msg}`+b('off','Abbrechen','g');
 else if(scr=='joinwait')h=`<h1>Verbinde…</h1>${msg}`+b('off','Abbrechen','g');
 else h=`<h1>🎮 Duell-Arena 3D</h1><div class="sub">5 Spiele · 1 gegen 1 · auf zwei Geräten oder gegen den Computer · am Handy am besten im Querformat</div>`+b('host','🌐 Online hosten')+`<div>Code eintippen: <input id="jc" maxlength="4" placeholder="CODE" value="${old}"> `+b('join','Beitreten')+`</div><div class="sub">Offene Spiele: `+(lob.length?lob.map(c=>`<span class="b c" data-a="joinc" data-c="${c}">${c}</span>`).join(''):'keine gefunden ')+b('ref','↻','g')+`</div>`+b('solo','🤖 Gegen KI spielen','g')+msg;
 m.innerHTML=h}
$('menu').onclick=e=>{audioInit();const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
 if(a=='host')hostGo();else if(a=='join')joinGo($('jc').value);else if(a=='joinc')joinGo(t.dataset.c);else if(a=='ref'){lobT=Date.now();lobby()}
 else if(a=='solo'){solo=true;scr='pick';ui()}else if(a=='off')netOff('');
 else if(a.startsWith('g:')){if(net!=2)begin(a.slice(2))}
 else if(a=='again')begin(curK);else if(a=='menu'){if(net==1&&conn&&conn.open)conn.send({t:'menu'});toMenu()}};
ui();lobby();requestAnimationFrame(frame);
</script></body></html>
